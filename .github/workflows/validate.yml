name: Validate Registry

on:
  pull_request:
    paths:
      - "packages/**"
      - "schemas/**"
      - "registry_core/**"
      - "gen-index.py"
      - "validate_registry.py"
      - "providers.json"
      - "diagnosis.json"
      - "override.json"
  push:
    branches: [registry]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate metadata and public sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python validate_registry.py --mods-dir packages
      - name: Build deterministic index
        run: python gen-index.py --mods-dir packages --output-dir site
