name: Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "重新读取每个 release 的说明（不看上一版索引）"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Pages release lookup
        run: |
          node --check site/app.js
          node --check site/release-api.js
          find site/js sprocket_mod_manager/presentation/client_ui/js -name '*.js' -exec node --check {} \;
          node tests/site_release_api.test.js
      - name: Validate metadata and public sources
        if: github.event_name != 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python validate_registry.py --mods-dir mods
      - name: Validate metadata for scheduled refresh
        if: github.event_name == 'schedule'
        run: python validate_registry.py --mods-dir mods --offline
      - name: Build Pages registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/mods site/schemas
          cp -R mods/. site/mods/
          cp -R schemas/. site/schemas/
          if [ "${{ inputs.refresh }}" = "true" ]; then
            python gen-index.py --mods-dir mods --output site/index.json --fetch-releases --refresh
          else
            python gen-index.py --mods-dir mods --output site/index.json --fetch-releases
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
