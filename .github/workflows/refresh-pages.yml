name: Refresh Pages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # pages.yml lives on the registry branch, and GitHub reads schedule
      # triggers only from the default branch, so the hourly refresh is
      # dispatched from here.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref registry --repo "${{ github.repository }}"
